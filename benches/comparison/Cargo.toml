[package]
name = "websocket-comparison"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
bytes = "1"
fastwebsockets = { version = "=0.10.0", features = ["upgrade"] }
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
rand = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
tokio-tungstenite = "=0.30.0"
yawc = { path = "../..", default-features = false }

[profile.release]
debug = 1
