name: Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build
        run: cargo build --verbose --all-features --all-targets
      - name: Test
        run: cargo test --verbose
      - name: Test zlib
        run: cargo test --verbose --features zlib
      - name: Test axum
        # Without http2, so the axum extractor is covered in the same shape the autobahn
        # suite builds it: extended CONNECT compiled out.
        run: cargo test --verbose --features axum,zlib
      - name: Test http2
        # axum comes along because the RFC 8441 extractor test needs both features.
        run: cargo test --verbose --features http2,axum
      - name: Test WASM
        run: |
          env WASM_BINDGEN_USE_BROWSER=1 wasm-pack test --headless --chrome --lib
          wasm-pack test --node --lib
      - name: Check formatting
        run: cargo fmt -- --check --verbose
      - name: Autobahn|Testsuite client (with zlib)
        if: matrix.os == 'ubuntu-latest'
        # A suite that hangs never finishes its step, and GitHub serves no log for a
        # step still in progress, so an uncapped hang costs the job's whole hour and
        # leaves nothing to read. The cap fails it while the log is still retrievable.
        timeout-minutes: 20
        run: |
          deno run -A --unstable autobahn/client-test.js zlib
      - name: Autobahn|Testsuite server (with zlib)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 20
        run: |
          deno run -A --unstable autobahn/server-test.js zlib
