[package]
name = "yawcc"
version = "0.1.3"
edition = "2021"
authors = ["Dario <dario@infinitefieldtrading.com>"]
description = "CLI tool using yawc"
repository = "https://github.com/infinitefield/yawc"
license = "LGPL-3.0-or-later"
keywords = ["websocket", "websockets", "ws", "networking", "async"]
categories = [
    "network-programming",
    "asynchronous",
    "web-programming",
    "web-programming::websocket",
]
readme = "README.md"
rust-version = "1.82.0"

# [patch.crates-io]
# yawc = { path = ".." }

[workspace]

[dependencies]
yawc = { version = "0.4", path = "..", default-features = false, features = ["rustls-aws-lc-rs"] }
rustyline = "14.0.0"
clap = { version = "4.5.20", features = ["derive"] }
anyhow = "1.0.91"
tokio = { version = "1.43.1", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
    "signal",
    "io-util",
    "net",
    "sync",
] }
url = "2.5.3"
futures = { version = "0.3.31", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26.0", default-features = false, features = [
    "aws-lc-rs",
    "logging",
    "tls12",
] }
home = "0.5.9"
humantime = "2.1.0"
serde_json = "1.0.132"
hyper-util = { version = "0.1.10", features = ["http1", "server"] }
hyper = { version = "1.6.0", features = ["http1", "server", "client"] }
http-body-util = "0.1.2"
chrono = "0.4.41"
base64 = "0.22"
sha1 = "0.10"
rand = "0.9"
rustls-pemfile = "2"
webpki-roots = "1"
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", default-features = false, features = ["term"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tokio = { version = "1.43.1", features = ["process"] }
rcgen = "0.13"
tempfile = "3"
